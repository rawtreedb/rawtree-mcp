name: Publish

on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    if: github.repository == 'rawtreedb/rawtree-mcp'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.2.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Use an npm that supports trusted publishing
        run: npm install -g npm@^11.5.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: Verify release tag matches package version
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const tag = process.env.TAG_NAME.replace(/^v/, '');
          if (pkg.version !== tag) {
            throw new Error(`Release tag ${process.env.TAG_NAME} does not match package version ${pkg.version}`);
          }
          NODE
      # Auth uses npm trusted publishing (OIDC, no stored token), configured for this workflow on npmjs.com.
      - run: npm publish --provenance --access public

  platform-pr:
    name: Open hosted MCP bump PR
    needs: npm
    if: github.repository == 'rawtreedb/rawtree-mcp' && !github.event.release.prerelease
    runs-on: ubuntu-latest
    permissions: {}
    concurrency:
      group: platform-mcp-${{ github.event.release.tag_name }}
    steps:
      - name: Create platform GitHub App token
        id: platform-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.PLATFORM_RELEASE_APP_ID }}
          private-key: ${{ secrets.PLATFORM_RELEASE_APP_PRIVATE_KEY }}
          owner: rawtreedb
          repositories: rawtree-platform
          permission-contents: write
          permission-pull-requests: write

      - name: Check out platform main
        uses: actions/checkout@v4
        with:
          repository: rawtreedb/rawtree-platform
          ref: main
          token: ${{ steps.platform-token.outputs.token }}
          persist-credentials: false
          path: platform

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Update the hosted MCP pin
        id: bump
        working-directory: platform/mcp
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version=${RELEASE_TAG#v}
          current=$(node -p "require('./package.json').dependencies['@rawtree/mcp']")
          stable_version='^[0-9]+\.[0-9]+\.[0-9]+$'
          if [[ ! "$version" =~ $stable_version || ! "$current" =~ $stable_version ]]; then
            echo "::error::Expected an exact stable release version and platform pin."
            exit 1
          fi

          if ! dpkg --compare-versions "$version" gt "$current"; then
            echo "Platform already pins @rawtree/mcp@$current, at or above $version."
            exit 0
          fi

          npm install --package-lock-only --save-exact --ignore-scripts --no-audit --no-fund "@rawtree/mcp@$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Open or update the platform PR
        if: steps.bump.outputs.version != ''
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ steps.platform-token.outputs.token }}
          path: platform
          base: main
          branch: automation/hosted-mcp-${{ steps.bump.outputs.version }}
          add-paths: |
            mcp/package.json
            mcp/package-lock.json
          title: Bump hosted MCP to ${{ steps.bump.outputs.version }}
          commit-message: Bump hosted MCP to ${{ steps.bump.outputs.version }}
          body: |
            Pin the hosted Worker to [@rawtree/mcp ${{ steps.bump.outputs.version }}](${{ github.event.release.html_url }}).

            The platform MCP workflow verifies the Worker on this PR and deploys it after merge.
